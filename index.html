<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мини-Вики: страны и столицы</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="geo-checking">
<div id="geo"><div class="gbox"><div style="font-size:54px">🚫</div><h2>Доступ ограничен</h2><p>Сайт недоступен для посетителей из вашей страны<span id="gc"></span>.</p><p>Чтобы зайти, включите <b>VPN</b> и нажмите кнопку ниже.</p><button onclick="geoCheck()">Я включил VPN — проверить</button><small id="gs"></small></div></div>
<header>
  <h1 onclick="home()">📖 Мини-Вики</h1>
  <input id="q" placeholder="Поиск страны или столицы…" oninput="home()">
</header>
<main>
  <div class="card" id="view"></div>
  <div class="card">
    <h2 style="font-size:22px">🤖 ИИ-помощник</h2>
    <div class="row">
      <input type="password" id="key" placeholder="API-ключ Google Gemini (AIza…)">
      <button onclick="saveKey()">Сохранить ключ</button><button class="ghost" onclick="testKey()">Проверить</button>
    </div>
    <small id="ks"></small>
    <div class="chips" id="chips"></div>
    <div class="row">
      <button class="ghost" onclick="suggest()">💡 Подобрать промпты</button>
      <button class="ghost" onclick="auto()">⚡ Авто-режим</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input type="text" id="ask" placeholder="Спроси про столицы и страны…" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">Спросить</button>
    </div>
    <small>Ключ хранится только в вашем браузере. Без ключа помощник отвечает по базе вики попроще.</small>
  </div>
</main>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="geoblock.js"></script>
</body>
</html>
